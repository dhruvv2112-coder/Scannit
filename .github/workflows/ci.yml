name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff>=0.5
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test-schemas:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared schemas
        run: pip install -e "packages/shared-schemas[dev]"
      - name: Test schemas
        run: pytest packages/shared-schemas/tests -v

  test-api:
    runs-on: ubuntu-latest
    needs: [lint, test-schemas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e "packages/shared-schemas"
          pip install -e "services/api[dev]"
      - name: Test API
        run: pytest services/api/tests -v

  build:
    runs-on: ubuntu-latest
    needs: [test-api, test-schemas]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t scannit-api:ci .
      - name: Build Orchestrator image
        run: docker build -f services/orchestrator/Dockerfile -t scannit-orchestrator:ci .
