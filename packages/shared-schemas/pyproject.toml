[project]
name = "scannit-schemas"
version = "0.1.0"
description = "Shared Pydantic v2 schemas for the Scannit platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scannit_schemas*"]
