[project]
name = "scannit-orchestrator"
version = "0.1.0"
description = "Scannit job orchestration and task queue service"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4,<6",
    "pydantic>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "boto3>=1.34,<2",
    "redis>=5.0,<6",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]
