[project]
name = "scannit"
version = "0.1.0"
description = "RGB camera imagery → large-scale, metric-scaled 3D environments"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["scannit_schemas"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests", "services/orchestrator/tests", "services/asset-catalog/tests", "packages/shared-schemas/tests"]
asyncio_mode = "auto"
